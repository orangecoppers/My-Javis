[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-javis"
version = "0.1.0"
description = "Local voice assistant for low-frequency fixed-gear resale research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.2.0",
  "numpy>=1.26.0",
  "playwright>=1.52.0",
  "pvrecorder>=1.2.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
